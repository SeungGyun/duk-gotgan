[project]
name = "dukgotgan-backend"
version = "0.1.0"
description = "덕!곳간 백엔드 — 키워드/강의 저장소와 UI 용 REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
    "pydantic-settings>=2.6.0",
    "youtube-transcript-api>=1.2",
    "yt-dlp>=2026.7",
]

[project.optional-dependencies]
# 오디오 받아쓰기 폴백. 애플 실리콘 전용이라 기본 의존성에 넣지 않습니다 —
# 없으면 자막 경로만 쓰고, 그마저 막히면 대기 상태로 남습니다.
asr = [
    "mlx-whisper>=0.4",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
