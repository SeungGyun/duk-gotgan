[project]
name = "dukgotgan-backend"
version = "0.1.0"
description = "덕!곳간 백엔드 — 키워드/강의 저장소와 UI 용 REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
    "pydantic-settings>=2.6.0",
    "youtube-transcript-api>=1.2",
    # **낡으면 파이프라인이 통째로 섭니다.** 유튜브가 스트리밍 URL 서명
    # 방식을 자주 바꾸고, 그때마다 옛 yt-dlp 는 `unable to download video
    # data: HTTP Error 403` 을 냅니다. 메타데이터는 멀쩡히 읽히고 **실제
    # 내려받기만** 막혀서 IP 차단처럼 보이는 것이 고약합니다 — 2026-08-20
    # 에 VPN 을 바꿔 가며 찾다가, 같은 IP 에서 버전만 올려 갈렸습니다
    # (2026.7.4 → 403 / 2026.8.19 → 3초에 15MB).
    #
    # 그래서 바닥을 올려 둡니다. 여기가 열려 있으면 다른 기계에서
    # `uv sync` 할 때 옛 버전이 그대로 깔립니다.
    "yt-dlp>=2026.8.19",
    # 요약을 만드는 곳. **인증은 구독입니다** — ANTHROPIC_API_KEY 를 쓰지
    # 않고, 이 기계에 로그인된 Claude Code 를 그대로 씁니다.
    #
    # 이게 여기 빠져 있었습니다. 지금 기계에는 손으로 깔려 있어서 돌지만,
    # 새 기계에 받아서 `uv sync` 하면 요약 단계가 통째로 안 뜹니다 —
    # 그것도 첫 요약을 시도할 때까지는 멀쩡해 보입니다.
    "claude-agent-sdk>=0.2",
]

[project.optional-dependencies]
# 오디오 받아쓰기 폴백. 애플 실리콘 전용이라 기본 의존성에 넣지 않습니다 —
# 없으면 자막 경로만 쓰고, 그마저 막히면 대기 상태로 남습니다.
asr = [
    "mlx-whisper>=0.4",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
