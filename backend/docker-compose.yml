# 덕!곳간 전용 MySQL.
#
# GuruguruCoin 의 MySQL(포트 3306, 볼륨 guruguru)과 **완전히 분리**합니다.
# 같은 서버에 스키마만 추가하면 컨테이너 수명과 볼륨이 묶여서, 저쪽 프로젝트를
# 내리거나 볼륨을 지울 때 이쪽 데이터까지 같이 사라집니다.
services:
  mysql:
    image: mysql:8.0
    container_name: dukgotgan_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dukgotgan_root
      MYSQL_DATABASE: dukgotgan
      MYSQL_USER: dukgotgan
      MYSQL_PASSWORD: dukgotgan1234
      TZ: Asia/Seoul
    ports:
      # 3306 은 guruguru_mysql 이 쓰고 있으므로 3307
      - "3307:3306"
    volumes:
      - dukgotgan_mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      # 한국어 전문 검색용. FULLTEXT ... WITH PARSER ngram 이 2글자 단위로
      # 쪼개므로 "멱등" 같은 두 글자 질의부터 걸립니다.
      - --ngram-token-size=2
      # ── 메모리 ────────────────────────────────────────────
      # 16GB 기계에서 받아쓰기(위스퍼)와 요약(클로드)이 같이 도는데, 스왑이
      # 94% 까지 차서 요약 프로세스가 뜨지 못하고 60건이 죽었습니다.
      # MySQL 기본값은 서버용이라 이 규모에 과합니다 — 실측 570MB.
      #
      # 데이터가 26MB 라 버퍼 풀 64MB 면 통째로 캐시됩니다.
      - --innodb-buffer-pool-size=64M
      # 진단용 계측인데 그것만 200MB 넘게 씁니다. 개인 아카이브에서
      # 쿼리 성능을 뜯어볼 일이 없어 끕니다.
      - --performance-schema=OFF
      # 실제로는 워커·API 합쳐 다섯 손가락입니다.
      - --max-connections=30
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pdukgotgan_root"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dukgotgan_mysql_data:
