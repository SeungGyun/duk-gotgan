<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>덕!곳간</title>

    <!-- 탭 아이콘. SVG 를 먼저 두고 PNG 를 뒤에 둡니다 — 사파리 옛 판이
         SVG 파비콘을 못 읽어서, 그때 32px PNG 로 떨어집니다. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" />
    <!-- 폰 홈 화면에 올렸을 때. 이게 없으면 iOS 가 화면을 캡처해서 쓰는데,
         그러면 그때 열려 있던 목록이 아이콘이 됩니다. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="덕!곳간" />
    <meta name="theme-color" content="#1d5fa8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
