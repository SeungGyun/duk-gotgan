<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="덕!곳간">
  <!-- 덕!곳간 — "덕" 을 duck 으로 읽은 것입니다.
       16px 에서 읽히는 것이 전부입니다. 몸통까지 그린 것과 머리만 그린 것을
       나란히 놓고 봤더니, **머리와 목만 남긴 쪽**이 작은 크기에서 실루엣이
       가장 또렷했습니다. 몸통을 넣으면 16px 에서 그냥 덩어리가 됩니다.
       목을 아래로 흘려 잘리게 둔 것도 같은 이유입니다 — 동그라미가 떠 있는
       대신 "머리" 로 읽힙니다. -->
  <defs>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1d5fa8"/>
  <g clip-path="url(#r)">
    <g fill="#fff">
      <!-- 목 — 아래 모서리에서 잘립니다 -->
      <path d="M27 41 C26 50 25 56 24 64 L55 64 C53 55 50 48 48 41 Z"/>
      <!-- 머리 -->
      <circle cx="37" cy="29" r="17"/>
      <!-- 부리 — 끝이 둥근 쐐기. 뾰족하게 두면 새가 아니라 화살로 보입니다 -->
      <path d="M22 23 L7 28 Q4 30.5 7 33 L22 38 Z"/>
    </g>
    <!-- 눈. 점 하나지만 이게 있어야 어느 쪽을 보는지 잡힙니다 -->
    <circle cx="31" cy="23" r="3.1" fill="#1d5fa8"/>
  </g>
</svg>
